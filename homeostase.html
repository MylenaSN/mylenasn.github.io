<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patron Loop · Homeostase Human &amp; AI</title>
  <style>
    :root {
      --bg: #F4F4F4; --panel: #FFFFFF; --ink: #333333; --dim: #666666; --line: #E6E6E6;
      --human: #333333; --ai: #4a4a4a; --health: #1a1a1a; --gate: #555555; --hall: #666666;
      --wave: #555555;
      --font-title: system-ui, sans-serif; --font-body: system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font-body); }
    button { font: inherit; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }

    header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; }
    .kicker { margin: 0; font: 600 .72rem/1 var(--font-title); letter-spacing: .24em; text-transform: uppercase; color: var(--dim); }
    h1 { margin: .35rem 0 0; font: 700 clamp(1.35rem, 3.4vw, 1.9rem)/1.15 var(--font-title); }
    .credit { margin: .35rem 0 0; font-size: .8rem; color: var(--dim); }
    .waves { display: flex; gap: 6px; }
    .wave-dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
      font: 700 .78rem/1 var(--font-title); color: var(--dim); background: var(--panel); border: 2px solid var(--line); }
    .wave-dot.done { color: #fff; border-color: transparent; }
    .wave-dot.now { border-color: var(--wave); color: var(--wave); }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
    .brief { border-left: 6px solid var(--wave); margin-bottom: 16px; }
    .brief h2 { margin: 0; font: 700 1.1rem/1.25 var(--font-title); }
    .brief .call { margin: .5rem 0 0; font-size: 1.05rem; }
    .brief .meta { margin: .4rem 0 0; font-size: .82rem; color: var(--dim); }

    .grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

    .scale { position: relative; height: 150px; margin: 4px 0 10px; }
    .pivot { position: absolute; left: 50%; bottom: 8px; width: 0; height: 0; transform: translateX(-50%);
      border-left: 18px solid transparent; border-right: 18px solid transparent; border-bottom: 34px solid #BDBDBD; }
    .beam { position: absolute; left: 8%; right: 8%; bottom: 42px; height: 6px; border-radius: 3px; background: #9E9E9E;
      transform-origin: 50% 50%; transition: transform .5s cubic-bezier(.3,1.4,.5,1); }
    .pan { position: absolute; top: -46px; width: 96px; margin-left: -48px; text-align: center; font: 700 .78rem/1.2 var(--font-title); }
    .pan span { display: block; margin-top: 4px; height: 30px; border-radius: 0 0 48px 48px; color: #fff; padding-top: 6px; }
    .pan.h { left: 6%; } .pan.h span { background: var(--human); }
    .pan.a { left: 94%; } .pan.a span { background: var(--ai); }

    .status { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .ring { width: 18px; height: 18px; border-radius: 50%; background: #BDBDBD; box-shadow: 0 0 0 0 transparent; transition: background .3s; }
    .ring.ok { background: #2E9E5B; animation: pulse 1.6s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 #2E9E5B66; } 100% { box-shadow: 0 0 0 12px #2E9E5B00; } }
    .status strong { font: 700 1rem/1.2 var(--font-title); }
    .turn { margin-left: auto; font-size: .85rem; color: var(--dim); }

    .meter { margin: 10px 0; }
    .meter label { display: flex; justify-content: space-between; font-size: .86rem; }
    .bar { position: relative; height: 12px; border-radius: 6px; background: #EEEEEE; overflow: hidden; margin-top: 4px; }
    .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; transition: width .4s; }
    .bar b { position: absolute; top: 0; bottom: 0; border-left: 2px dashed #00000055; }

    .checks { list-style: none; margin: 14px 0 0; padding: 0; font-size: .86rem; }
    .checks li { padding: 3px 0 3px 24px; position: relative; color: var(--dim); }
    .checks li::before { content: "○"; position: absolute; left: 4px; }
    .checks li.ok { color: var(--ink); }
    .checks li.ok::before { content: "●"; color: #2E9E5B; }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .act { text-align: left; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
      cursor: pointer; transition: border-color .2s, transform .15s; }
    .act:hover:not(:disabled) { border-color: var(--wave); transform: translateY(-1px); }
    .act:disabled { cursor: not-allowed; opacity: .5; }
    .act strong { display: block; font: 700 .86rem/1.2 var(--font-title); }
    .act small { display: block; margin-top: 4px; color: var(--dim); font-size: .76rem; }
    .act.gate { grid-column: 1 / -1; background: var(--gate); color: #fff; border-color: var(--gate); }
    .act.gate small { color: #ffffffcc; }

    .log { margin-top: 16px; max-height: 210px; overflow: auto; font-size: .86rem; }
    .log h3 { margin: 0 0 6px; font: 700 .78rem/1 var(--font-title); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
    .log p { margin: 0; padding: 6px 0; border-top: 1px solid var(--line); }

    dialog { border: none; border-radius: 18px; padding: 22px; max-width: 30rem; width: calc(100vw - 2rem); box-shadow: 0 24px 64px #00000040; }
    dialog::backdrop { background: #00000088; backdrop-filter: blur(3px); }
    dialog h2 { margin: 0 0 8px; font: 700 1.15rem/1.25 var(--font-title); }
    dialog p { margin: 0 0 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .btn { padding: .6rem 1rem; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
    .btn.primary { background: var(--gate); border-color: var(--gate); color: #fff; font-weight: 500; }
    .btn.warn { border-color: var(--hall); color: var(--hall); }
    table { width: 100%; border-collapse: collapse; font-size: .86rem; margin: 8px 0 14px; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <p class="kicker">Patron Loop · The Loop Game</p>
        <h1>Homeostase Human &amp; AI</h1>
        <p class="credit">Criadora: Mylena de Souza Nascimento · IA não é autora.</p>
      </div>
      <div class="waves" id="waves" aria-label="Progresso das 5 Waves"></div>
    </header>

    <section class="card brief" id="brief" aria-live="polite"></section>

    <div class="grid">
      <section class="card" aria-label="Estado do loop">
        <div class="status">
          <span class="ring" id="ring"></span>
          <strong id="state">—</strong>
          <span class="turn" id="turn"></span>
        </div>
        <div class="scale" aria-hidden="true">
          <div class="beam" id="beam">
            <div class="pan h">Humano<span id="pan-h"></span></div>
            <div class="pan a">IA<span id="pan-a"></span></div>
          </div>
          <div class="pivot"></div>
        </div>
        <div id="meters"></div>
        <ul class="checks" id="checks"></ul>
      </section>

      <section class="card" aria-label="Ações do ciclo">
        <div class="actions" id="actions"></div>
        <div class="log" aria-live="polite">
          <h3>Diário do loop</h3>
          <div id="log"></div>
        </div>
      </section>
    </div>
  </div>

  <dialog id="gate-dialog">
    <h2>Gate humano</h2>
    <p>O artefato do IA Lab está na sua mão. A máquina propôs; quem decide é você. Revisou o que é fato, o que é hipótese e o que é alucinação?</p>
    <div class="row">
      <button class="btn warn" data-decision="reprovar">Reprovar</button>
      <button class="btn" data-decision="ajuste">Pedir ajuste</button>
      <button class="btn primary" data-decision="aprovar">Aprovar</button>
    </div>
  </dialog>

  <dialog id="end-dialog">
    <h2 id="end-title"></h2>
    <div id="end-body"></div>
    <div class="row" id="end-actions"></div>
  </dialog>

  <script>
    const WAVES = [
      { id: "W01", nome: "Pré-voo · O Despertar", semanas: "S01 · S02", cor: "#555555",
        call: "Você não opera a máquina. Você desenha a base." },
      { id: "W02", nome: "Product Management · O Mapa de Valor", semanas: "S03 · S04", cor: "#4a4a4a",
        call: "Você não entrega volume. Você entrega valor." },
      { id: "W03", nome: "Tech Delivery · A Engenharia do Ciclo", semanas: "S05 · S06", cor: "#333333",
        call: "Você não reza pelo ciclo. Você engenharia o ritmo." },
      { id: "W04", nome: "Human & AI Teams · Times Híbridos", semanas: "S07 · S08", cor: "#1a1a1a",
        call: "Você não perde o time. Você orquestra humano & IA." },
      { id: "W05", nome: "Equilíbrio AI-Era", semanas: "S09 · S10", cor: "#666666",
        call: "Você não some na IA. Você normaliza a evolução — e multiplica no time." },
    ];

    const RULES = { minHuman: 55, minAi: 55, maxGap: 15, minHealth: 40, turns: 6, collapseGap: 40 };
    const START = { human: 40, ai: 30, health: 80 };
    const STORE_KEY = "patronloop.homeostase.v1";

    const driftFor = (wave) => ({ human: -2, ai: 3 + wave, health: -(2 + wave) });

    const ACTIONS = [
      { key: "conceito", titulo: "Aula 01 · Conceito", efeito: { human: 8, health: -4 },
        dica: "O porquê. Humano +8 · Saúde −4",
        bloqueio: (s) => s.conceito && "Conceito já fechado nesta wave.",
        feito: (s) => { s.conceito = true; },
        diario: "Conceito fechado. A Raiz destravou: agora o time precisa de evidência, não de opinião." },
      { key: "raiz", titulo: "Aula 02 · Raiz (sem IA)", efeito: { human: 18, health: -10 },
        dica: "Evidência humana do time. Humano +18 · Saúde −10",
        bloqueio: (s) => (!s.conceito && "Feche o Conceito primeiro.") || (s.raiz && "A Raiz já tem evidência."),
        feito: (s) => { s.raiz = true; },
        diario: "Evidência da Raiz no cofre. É a única chave da semana: o IA Lab destravou." },
      { key: "lab", titulo: "Aula 03 · IA Lab", efeito: { ai: 20, human: 4, health: -4 },
        dica: "A máquina acelera. IA +20 · Humano +4 · Saúde −4",
        bloqueio: (s) => (!s.raiz && "Aula 1 nunca destrava a Aula 3. Sem evidência da Raiz, não há Lab.") || (s.lab && "O artefato do Lab já está pronto para o gate."),
        feito: (s) => { s.lab = true; },
        diario: "O agente expandiu. Proposta na mesa: ainda não é decisão." },
      { key: "pausa", titulo: "Healthy Pause", efeito: { health: 22 },
        dica: "Saúde +22. A IA continua avançando enquanto você descansa.",
        bloqueio: (s) => s.health >= 100 && "Saúde já está cheia.",
        feito: (s) => { s.pausas += 1; },
        diario: "Pausa saudável. Líder exausto não fecha loop; o cuidado com quem cria faz parte do ciclo." },
      { key: "kill", titulo: "G5 Kill Switch", efeito: { ai: -25, health: -2 },
        dica: "IA −25. Só quando a máquina passa o humano.",
        bloqueio: (s) => s.ai <= s.human && "A IA não está dominando. Desligar agora seria medo, não gestão.",
        feito: (s) => { s.kills += 1; },
        diario: "Kill Switch acionado. GenAI non-dominant: a IA volta a ficar atrás das portas." },
    ];

    const $ = (id) => document.getElementById(id);
    const clamp = (v) => Math.max(0, Math.min(100, v));

    let progress = loadProgress();
    let s;

    function loadProgress() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORE_KEY));
        if (saved && Array.isArray(saved.closed)) return saved;
      } catch (_) { /* storage bloqueado ou corrompido: começa do zero */ }
      return { closed: [] };
    }

    function saveProgress() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (_) { /* modo privado */ }
    }

    function startWave() {
      const wave = progress.closed.length;
      s = { wave, turn: 1, ...START, conceito: false, raiz: false, lab: false, pausas: 0, kills: 0, log: [] };
      document.documentElement.style.setProperty("--wave", WAVES[wave].cor);
      note(`${WAVES[wave].id} começou. Pressão da automação nesta wave: IA +${driftFor(wave + 1).ai} por turno.`);
      render();
    }

    function checks() {
      return [
        { ok: s.raiz, txt: "Evidência humana da Raiz (Aula 02)" },
        { ok: s.lab, txt: "Artefato do IA Lab (Aula 03)" },
        { ok: s.human >= RULES.minHuman, txt: `Humano ≥ ${RULES.minHuman}` },
        { ok: s.ai >= RULES.minAi, txt: `IA ≥ ${RULES.minAi}` },
        { ok: Math.abs(s.human - s.ai) <= RULES.maxGap, txt: `Distância Humano–IA ≤ ${RULES.maxGap}` },
        { ok: s.health >= RULES.minHealth, txt: `Saúde humana ≥ ${RULES.minHealth}` },
      ];
    }

    function diagnosis() {
      const gap = s.ai - s.human;
      if (s.health < RULES.minHealth) return "Saúde humana em risco";
      if (gap > RULES.maxGap) return "IA dominando o loop";
      if (-gap > RULES.maxGap) return "Humano sem alavanca";
      if (s.human < RULES.minHuman || s.ai < RULES.minAi) return "Equilíbrio raso";
      return "Homeostase";
    }

    function apply(effect) {
      for (const [k, v] of Object.entries(effect)) s[k] = clamp(s[k] + v);
    }

    function act(action) {
      apply(action.efeito);
      action.feito(s);
      note(action.diario);
      endTurn();
    }

    function endTurn() {
      apply(driftFor(s.wave + 1));
      s.turn += 1;
      if (s.health <= 0) return fail("Burnout", "A saúde humana zerou. Sem quem cria, não existe loop para fechar.");
      if (s.ai - s.human >= RULES.collapseGap) return fail("IA dominou o loop", "A máquina passou a ditar o ritmo. O humano virou espectador e o loop perdeu o dono.");
      if (s.turn > RULES.turns) return fail("O ciclo acabou", "As duas semanas passaram sem homeostase. A wave ficou prometida, não entregue.");
      render();
    }

    function decide(decision) {
      $("gate-dialog").close();
      if (decision === "aprovar") return closeWave();
      if (decision === "ajuste") {
        s.lab = false;
        note("Pedido de ajuste. O artefato volta para o Lab; a evidência da Raiz continua valendo.");
      } else {
        s.raiz = false; s.lab = false;
        note("Reprovado. Volta para a Raiz: a evidência não sustentava o que a máquina propôs.");
      }
      endTurn();
    }

    function closeWave() {
      const w = WAVES[s.wave];
      progress.closed.push({ id: w.id, turnos: s.turn, pausas: s.pausas, kills: s.kills });
      saveProgress();
      const last = progress.closed.length === WAVES.length;
      $("end-title").textContent = last ? "Loop fechado em homeostase" : `${w.id} fechada`;
      $("end-body").innerHTML = last ? summary() :
        `<p>Humano ${s.human} · IA ${s.ai} · Saúde ${s.health}. A decisão foi humana, e só por isso o loop fechou.</p>
         <p>Próxima: <strong>${WAVES[s.wave + 1].nome}</strong>. A automação pressiona mais.</p>`;
      endButtons(last ? [["Jogar de novo", "primary", resetAll]] : [["Próxima wave", "primary", startWave]]);
    }

    function summary() {
      const rows = progress.closed.map((c) =>
        `<tr><td>${c.id}</td><td>${c.turnos}</td><td>${c.pausas}</td><td>${c.kills}</td></tr>`).join("");
      return `<p>As 5 Waves fecharam com humano e IA em equilíbrio, saúde preservada e gate humano em cada uma.</p>
        <table><thead><tr><th>Wave</th><th>Turno do gate</th><th>Pausas</th><th>Kill Switch</th></tr></thead><tbody>${rows}</tbody></table>
        <p>Para fechar um loop, a máquina precisa crescer junto com o humano, nunca no lugar dele.</p>`;
    }

    function fail(title, why) {
      note(`${title}. ${why}`);
      render();
      $("end-title").textContent = title;
      $("end-body").innerHTML = `<p>${why}</p><p>Humano ${s.human} · IA ${s.ai} · Saúde ${s.health}.</p>`;
      endButtons([["Recomeçar a wave", "primary", startWave]]);
    }

    function endButtons(list) {
      const box = $("end-actions");
      box.replaceChildren(...list.map(([label, cls, fn]) => {
        const b = document.createElement("button");
        b.className = `btn ${cls}`; b.textContent = label;
        b.onclick = () => { $("end-dialog").close(); fn(); };
        return b;
      }));
      $("end-dialog").showModal();
    }

    function resetAll() {
      progress = { closed: [] };
      saveProgress();
      startWave();
    }

    function note(text) {
      s.log.unshift(`T${Math.min(s.turn, RULES.turns)} · ${text}`);
    }

    function render() {
      const w = WAVES[s.wave];
      $("waves").replaceChildren(...WAVES.map((x, i) => {
        const d = document.createElement("span");
        d.className = "wave-dot" + (i < progress.closed.length ? " done" : i === s.wave ? " now" : "");
        if (i < progress.closed.length) d.style.background = x.cor;
        d.textContent = i + 1; d.title = x.nome;
        return d;
      }));

      $("brief").innerHTML = `<p class="kicker">${w.id} · ${w.semanas}</p><h2>${w.nome}</h2>
        <p class="call">${w.call}</p>
        <p class="meta">Feche a wave com o gate humano em até ${RULES.turns} turnos. Cada turno, a IA avança sozinha e a energia humana cai.</p>`;

      const state = diagnosis();
      $("state").textContent = state;
      $("ring").className = "ring" + (state === "Homeostase" ? " ok" : "");
      $("turn").textContent = `Turno ${Math.min(s.turn, RULES.turns)} de ${RULES.turns}`;

      const tilt = Math.max(-22, Math.min(22, (s.ai - s.human) * 0.7));
      $("beam").style.transform = `rotate(${tilt}deg)`;
      for (const pan of document.querySelectorAll(".pan")) pan.style.transform = `rotate(${-tilt}deg)`;
      $("pan-h").textContent = s.human; $("pan-a").textContent = s.ai;

      $("meters").innerHTML = [
        ["Humano · autoria e evidência", s.human, "var(--human)", RULES.minHuman],
        ["IA · expansão e velocidade", s.ai, "var(--ai)", RULES.minAi],
        ["Saúde humana · energia de quem cria", s.health, "var(--health)", RULES.minHealth],
      ].map(([label, v, color, min]) => `<div class="meter"><label><span>${label}</span><span>${v}</span></label>
        <div class="bar"><i style="width:${v}%;background:${color}"></i><b style="left:${min}%"></b></div></div>`).join("");

      const list = checks();
      $("checks").innerHTML = list.map((c) => `<li class="${c.ok ? "ok" : ""}">${c.txt}</li>`).join("");

      const buttons = ACTIONS.map((a) => {
        const reason = a.bloqueio(s);
        const b = document.createElement("button");
        b.className = "act"; b.disabled = Boolean(reason);
        b.innerHTML = `<strong>${a.titulo}</strong><small>${reason || a.dica}</small>`;
        b.onclick = () => act(a);
        return b;
      });
      const ready = list.every((c) => c.ok);
      const gate = document.createElement("button");
      gate.className = "act gate"; gate.disabled = !ready;
      gate.innerHTML = `<strong>Gate humano · fechar o loop</strong><small>${ready
        ? "Homeostase atingida. A decisão é sua."
        : "Só abre com Raiz, Lab e homeostase. Veja a lista à esquerda."}</small>`;
      gate.onclick = () => $("gate-dialog").showModal();
      $("actions").replaceChildren(...buttons, gate);

      $("log").innerHTML = s.log.map((t) => `<p>${t}</p>`).join("");
    }

    for (const b of document.querySelectorAll("#gate-dialog [data-decision]")) {
      b.onclick = () => decide(b.dataset.decision);
    }

    if (progress.closed.length >= WAVES.length) progress = { closed: [] };
    startWave();
  </script>
</body>
</html>
